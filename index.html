
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

#crop {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

#goaloo {
    position: absolute;

    /* TOP CROP */
    top: -60px;

    /* LEFT CROP */
    left: -40px;

    width: calc(100% + 80px);
    height: calc(100% + 60px);

    border: 0;

    pointer-events: none;
}

/* BLOCK ALL MOUSE AND TOUCH INTERACTIONS */
#blocker {
    position: absolute;
    inset: 0;
    z-index: 9999;
    background: transparent;
    pointer-events: auto;
    touch-action: none;
    user-select: none;
}
</style>
</head>

<body>

<div id="crop">

    <iframe
        id="goaloo"
        frameborder="0"
        tabindex="-1">
    </iframe>

    <div id="blocker" aria-hidden="true"></div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const goalooFrame = document.getElementById("goaloo");

if (id && id.trim() !== "") {
    goalooFrame.src =
        "https://live.goaloo901.com/basketball/match-" +
        encodeURIComponent(id.trim());
}
</script>

</body>
</html>
