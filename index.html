<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Goaloo Display</title>

    <style>
        /* =========================================================
           LOCK THE OUTER PAGE
           ========================================================= */

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden !important;

            background: #ffffff;

            overscroll-behavior: none !important;

            touch-action: none !important;
        }


        /* =========================================================
           FIXED CROPPING WINDOW
           ========================================================= */

        #crop {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            width: 100%;
            height: 100%;

            overflow: hidden !important;

            background: #ffffff;

            overscroll-behavior: none !important;

            touch-action: none !important;
        }


        /* =========================================================
           GOALOO FRAME
           ========================================================= */

        #goaloo {
            position: absolute;


            /*
             * =====================================================
             * TOP CROP
             *
             * Removes 100px from the top.
             * =====================================================
             */
            top: -5px;


            /*
             * =====================================================
             * LEFT CROP
             *
             * Removes 40px from the left.
             * =====================================================
             */
            left: -40px;


            /*
             * =====================================================
             * WIDTH
             *
             * 40px cropped from LEFT
             * 40px cropped from RIGHT
             *
             * Total extra width = 80px
             * =====================================================
             */
            width: calc(100% + 80px);


            /*
             * =====================================================
             * HEIGHT
             *
             * Compensates for the 100px top crop.
             * =====================================================
             */
            height: calc(100% + 100px);


            border: 0;

            display: block;

            background: #ffffff;


            /*
             * =====================================================
             * DISPLAY ONLY
             *
             * No clicking
             * No tapping
             * No dragging
             * No swiping
             * No scrolling
             * =====================================================
             */
            pointer-events: none;

            touch-action: none !important;

            overscroll-behavior: none !important;
        }
    </style>
</head>


<body>

    <!-- =========================================================
         FIXED DISPLAY WINDOW
         ========================================================= -->

    <div id="crop">

        <iframe
            id="goaloo"
            frameborder="0"
            scrolling="no"
            allow="fullscreen">
        </iframe>

    </div>


    <script>
        /* =========================================================
           GET MATCH ID FROM APPSMITH
           ========================================================= */

        const params = new URLSearchParams(
            window.location.search
        );

        const id = params.get("id");

        const goalooFrame =
            document.getElementById("goaloo");


        /* =========================================================
           LOAD GOALOO MATCH
           ========================================================= */

        if (id && id.trim() !== "") {

            const goalooUrl =
                "https://live.goaloo901.com/basketball/match-" +
                encodeURIComponent(id.trim());

            goalooFrame.src = goalooUrl;

        } else {

            goalooFrame.src = "about:blank";

        }
    </script>

</body>
</html>
