<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Goaloo Frame</title>

    <style>
        /* =========================================================
           PAGE
           ========================================================= */

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden !important;

            background: #ffffff;

            overscroll-behavior: none !important;
        }


        /* =========================================================
           CROPPING WINDOW
           ========================================================= */

        #crop {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            width: 100%;
            height: 100%;

            overflow: hidden !important;

            background: #ffffff;

            overscroll-behavior: none !important;
        }


        /* =========================================================
           GOALOO IFRAME
           ========================================================= */

        #goaloo {
            position: absolute;

            /*
             * CROP FROM TOP
             *
             * Change -200px if needed:
             *
             * -100px = crop 100px
             * -150px = crop 150px
             * -200px = crop 200px
             * -250px = crop 250px
             * -300px = crop 300px
             */
            top: -200px;

            left: 0;

            /*
             * Extra width pushes the Goaloo
             * scrollbar outside the visible area.
             */
            width: calc(100% + 25px);

            /*
             * Add the cropped height back so
             * the bottom of the page remains available.
             */
            height: calc(100% + 200px);

            border: 0;

            display: block;

            background: #ffffff;

            overscroll-behavior: none !important;
        }
    </style>
</head>


<body>

    <!-- =========================================================
         CROPPED VIEWPORT
         ========================================================= -->

    <div id="crop">

        <iframe
            id="goaloo"
            frameborder="0"
            scrolling="yes"
            allow="fullscreen">
        </iframe>

    </div>


    <script>
        /* =========================================================
           GET MATCH ID FROM APPSMITH
           
           Appsmith loads this page as:

           https://betpointalerts.github.io/goalooframe/?id=12345

           The ID is then used to create the Goaloo URL.
           ========================================================= */

        const params = new URLSearchParams(window.location.search);

        const id = params.get("id");

        const goalooFrame = document.getElementById("goaloo");


        /* =========================================================
           LOAD GOALOO MATCH
           ========================================================= */

        if (id && id.trim() !== "") {

            const goalooUrl =
                "https://live.goaloo901.com/basketball/match-" +
                encodeURIComponent(id.trim());

            goalooFrame.src = goalooUrl;

        } else {

            /*
             * No ID was supplied.
             */
            goalooFrame.src = "about:blank";

        }
    </script>

</body>
</html>
