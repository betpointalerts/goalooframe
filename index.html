<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Goaloo Display</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden !important;
    background: #ffffff;
}

#crop {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden !important;
}

/* Goaloo stays visible */
#goaloo {
    position: absolute;

    top: -50px;
    left: -40px;

    width: calc(100% + 80px);
    height: calc(100% + 50px);

    border: 0;
    display: block;

    /*
     * This is the part that actually
     * prevents the iframe from scrolling.
     */
    pointer-events: none;
}
</style>
</head>

<body>

<div id="crop">

    <iframe
        id="goaloo"
        frameborder="0"
        scrolling="no">
    </iframe>

</div>

<script>
const params = new URLSearchParams(
    window.location.search
);

const id = params.get("id");

const goalooFrame =
    document.getElementById("goaloo");

if (id && id.trim() !== "") {

    goalooFrame.src =
        "https://live.goaloo901.com/basketball/match-" +
        encodeURIComponent(id.trim());

} else {

    goalooFrame.src = "about:blank";

}
</script>

</body>
</html>
