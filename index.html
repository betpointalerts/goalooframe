<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fff;
    }

    #crop {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    #goaloo {
        position: absolute;
        top: 0;
        left: 0;

        /*
         * Make the iframe slightly wider than
         * the visible area so the right scrollbar
         * gets cropped.
         */
        width: calc(100% + 25px);
        height: 100%;

        border: 0;
    }
</style>
</head>

<body>

<div id="crop">
    <iframe
        id="goaloo"
        scrolling="yes"
        frameborder="0">
    </iframe>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (id) {
        document.getElementById("goaloo").src =
            "https://live.goaloo901.com/basketball/match-" +
            encodeURIComponent(id);
    }
</script>

</body>
</html>
