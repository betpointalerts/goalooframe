<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;

        /* Prevent the wrapper itself from scrolling */
        overflow: hidden !important;

        /* Prevent overscroll/bounce */
        overscroll-behavior: none !important;

        /* Prevent touch scrolling on the wrapper */
        touch-action: none !important;

        background: #fff;
    }

    #crop {
        position: fixed;
        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        overflow: hidden !important;

        /* Prevent wrapper scrolling */
        overscroll-behavior: none !important;
        touch-action: none !important;
    }

    #goaloo {
        position: absolute;
        top: 0;
        left: 0;

        /*
         * Make the iframe 25px wider than the
         * visible container so the scrollbar
         * on the right is cropped out.
         */
        width: calc(100% + 25px);
        height: 100%;

        border: 0;

        /*
         * Prevent the iframe element itself
         * from being treated as a touch-scroll
         * surface by the wrapper.
         */
        overscroll-behavior: none !important;
    }
</style>
</head>

<body>

<div id="crop">

    <iframe
        id="goaloo"
        scrolling="yes"
        frameborder="0"
        allow="fullscreen">
    </iframe>

</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (id) {
        const goalooUrl =
            "https://live.goaloo901.com/basketball/match-" +
            encodeURIComponent(id);

        document.getElementById("goaloo").src = goalooUrl;
    }
</script>

</body>
</html>
