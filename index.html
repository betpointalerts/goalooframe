<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Goaloo Frame</title>

    <style>
        /* =========================================================
           LOCK ONLY THE GITHUB WRAPPER
           ========================================================= */

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden !important;

            background: #ffffff;

            overscroll-behavior: none !important;
        }


        /* =========================================================
           WRAPPER / VIEWPORT
           ========================================================= */

        #crop {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            width: 100%;
            height: 100%;

            overflow: hidden !important;

            background: #ffffff;

            overscroll-behavior: none !important;

            /*
             * Prevent the GitHub wrapper itself from
             * becoming a touch/scroll surface.
             */
            touch-action: none !important;
        }


        /* =========================================================
           GOALOO FRAME
           ========================================================= */

        #goaloo {
            position: absolute;

            /*
             * Crop unwanted top area
             */
            top: -50px;

            /*
             * Crop 40px from left
             */
            left: -40px;

            /*
             * Crop 40px from left
             * Crop 40px from right
             */
            width: calc(100% + 80px);

            /*
             * Compensate for top crop
             */
            height: calc(100% + 50px);

            border: 0;

            display: block;

            background: #ffffff;

            /*
             * IMPORTANT:
             * Do NOT use pointer-events:none here.
             *
             * Goaloo remains visible and can still
             * receive its own interaction.
             */
        }
    </style>
</head>


<body>

    <div id="crop">

        <iframe
            id="goaloo"
            frameborder="0"
            scrolling="yes">
        </iframe>

    </div>


    <script>
        /* =========================================================
           GET MATCH ID FROM APPSMITH
           ========================================================= */

        const params = new URLSearchParams(
            window.location.search
        );

        const id = params.get("id");

        const goalooFrame =
            document.getElementById("goaloo");


        /* =========================================================
           LOAD GOALOO
           ========================================================= */

        if (id && id.trim() !== "") {

            goalooFrame.src =
                "https://live.goaloo901.com/basketball/match-" +
                encodeURIComponent(id.trim());

        } else {

            goalooFrame.src = "about:blank";

        }
    </script>

</body>
</html>
