<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Goaloo Frame</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        #crop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #goaloo {
            position: absolute;

            /* Crop unwanted top area */
            top: -50px;

            /* Crop 40px from left */
            left: -40px;

            /* Crop 40px from left + 40px from right */
            width: calc(100% + 80px);

            /* Compensate for top crop */
            height: calc(100% + 50px);

            border: 0;
            display: block;
        }
    </style>
</head>

<body>

<div id="crop">
    <iframe
        id="goaloo"
        frameborder="0"
        scrolling="yes">
    </iframe>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    const goalooFrame = document.getElementById("goaloo");

    if (id && id.trim() !== "") {
        goalooFrame.src =
            "https://live.goaloo901.com/basketball/match-" +
            encodeURIComponent(id.trim());
    }
</script>

</body>
</html>
