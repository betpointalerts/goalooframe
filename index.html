<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Goaloo Display</title>

    <style>
        /* =========================================================
           LOCK THE OUTER PAGE
           ========================================================= */

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden !important;

            background: #ffffff;

            overscroll-behavior: none !important;

            touch-action: none !important;
        }


        /* =========================================================
           FIXED CROPPING WINDOW
           ========================================================= */

        #crop {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            width: 100%;
            height: 100%;

            overflow: hidden !important;

            background: #ffffff;

            overscroll-behavior: none !important;

            touch-action: none !important;
        }


        /* =========================================================
           GOALOO FRAME
           ========================================================= */

        #goaloo {
            position: absolute;

            /*
             * =====================================================
             * TOP CROP
             *
             * Removes the first 50px of Goaloo's page.
             *
             * The remaining content starts at the very top
             * of the visible frame.
             * =====================================================
             */
            top: -70px;


            /*
             * =====================================================
             * LEFT / RIGHT CROP
             *
             * 40px removed from LEFT
             * 40px removed from RIGHT
             * =====================================================
             */
            left: -40px;

            width: calc(100% + 80px);


            /*
             * =====================================================
             * HEIGHT
             *
             * Compensate for the 50px top crop.
             * =====================================================
             */
            height: calc(100% + 70px);


            border: 0;

            display: block;

            background: #ffffff;


            /*
             * =====================================================
             * DISPLAY ONLY
             * =====================================================
             */
            pointer-events: none;

            touch-action: none !important;

            overscroll-behavior: none !important;
        }
    </style>
</head>


<body>

    <div id="crop">

        <iframe
            id="goaloo"
            frameborder="0"
            scrolling="no"
            allow="fullscreen">
        </iframe>

    </div>


    <script>
        const params = new URLSearchParams(
            window.location.search
        );

        const id = params.get("id");

        const goalooFrame =
            document.getElementById("goaloo");


        if (id && id.trim() !== "") {

            const goalooUrl =
                "https://live.goaloo901.com/basketball/match-" +
                encodeURIComponent(id.trim());

            goalooFrame.src = goalooUrl;

        } else {

            goalooFrame.src = "about:blank";

        }
    </script>

</body>
</html>
