<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Goaloo Display</title>

    <style>
        /* =========================================================
           LOCK THE OUTER PAGE
           ========================================================= */

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden !important;

            background: #ffffff;

            overscroll-behavior: none !important;

            touch-action: none !important;
        }


        /* =========================================================
           FIXED CROPPING WINDOW
           ========================================================= */

        #crop {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            width: 100%;
            height: 100%;

            overflow: hidden !important;

            background: #ffffff;

            overscroll-behavior: none !important;

            touch-action: none !important;
        }


        /* =========================================================
           GOALOO FRAME
           ========================================================= */

        #goaloo {
            position: absolute;

            /*
             * =====================================================
             * TOP CROP
             *
             * Removes 50px from the top.
             *
             * Increase to -75px, -100px, etc. if needed.
             * =====================================================
             */
            top: -50px;


            /*
             * =====================================================
             * LEFT CROP
             *
             * Removes 40px from the left.
             * =====================================================
             */
            left: -40px;


            /*
             * =====================================================
             * WIDTH
             *
             * 40px is cropped from the left
             * 40px is cropped from the right
             *
             * Therefore add 80px to the width.
             * =====================================================
             */
            width: calc(100% + 80px);


            /*
             * =====================================================
             * HEIGHT
             *
             * We moved the iframe 50px upward,
             * so add 50px to maintain the visible bottom.
             * =====================================================
             */
            height: calc(100% + 50px);


            border: 0;

            display: block;

            background: #ffffff;


            /*
             * =====================================================
             * DISPLAY ONLY
             *
             * Users cannot:
             * - click
             * - tap
             * - drag
             * - swipe
             * - scroll
             * - interact with Goaloo
             * =====================================================
             */
            pointer-events: none;

            touch-action: none !important;

            overscroll-behavior: none !important;
        }
    </style>
</head>


<body>

    <!-- =========================================================
         DISPLAY WINDOW
         ========================================================= -->

    <div id="crop">

        <iframe
            id="goaloo"
            frameborder="0"
            scrolling="no"
            allow="fullscreen">
        </iframe>

    </div>


    <script>
        /* =========================================================
           GET MATCH ID FROM APPSMITH

           Appsmith loads this page as:

           https://betpointalerts.github.io/goalooframe/?id=12345
           ========================================================= */

        const params = new URLSearchParams(
            window.location.search
        );

        const id = params.get("id");

        const goalooFrame =
            document.getElementById("goaloo");


        /* =========================================================
           LOAD THE CORRECT GOALOO MATCH
           ========================================================= */

        if (id && id.trim() !== "") {

            const goalooUrl =
                "https://live.goaloo901.com/basketball/match-" +
                encodeURIComponent(id.trim());

            goalooFrame.src = goalooUrl;

        } else {

            goalooFrame.src = "about:blank";

        }
    </script>

</body>
</html>
